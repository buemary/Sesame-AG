name: Sync Upstream

on:
  schedule:
    - cron: '0 */3 * * *'   
  workflow_dispatch:         

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: true

      - name: Set Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream and check for changes
        id: check
        run: |
          git remote add upstream https://github.com/Sesame-AG/Sesame-AG.git
          git fetch upstream dev

          UPSTREAM_HASH=$(git rev-parse upstream/dev)
          LOCAL_HASH=$(git rev-parse dev)

          echo "upstream_hash=$UPSTREAM_HASH" >> $GITHUB_OUTPUT
          echo "local_hash=$LOCAL_HASH" >> $GITHUB_OUTPUT

          if [ "$UPSTREAM_HASH" != "$LOCAL_HASH" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Merge upstream changes
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git merge upstream/dev --no-edit
          git push origin dev
